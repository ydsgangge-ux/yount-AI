<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRM Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  #vrm-container {
    width: 100%; height: 100%;
    position: relative;
    background: transparent;
  }
  #vrm-canvas {
    width: 100%; height: 100%;
    display: block;
    filter: drop-shadow(0 0 8px rgba(0,212,255,0.35))
            drop-shadow(0 0 20px rgba(0,212,255,0.15));
  }
  .scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,0.03) 2px,
      rgba(0,212,255,0.03) 4px
    );
    pointer-events: none;
    opacity: 0.6;
  }
  .status-bar {
    position: absolute;
    bottom: 4px; left: 8px; right: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00D4FF;
    box-shadow: 0 0 4px #00D4FF;
    animation: pulse 2s ease-in-out infinite;
  }
  .status-label {
    color: rgba(0,212,255,0.5);
    font-family: 'Consolas', monospace;
    font-size: 9px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  #loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(0,212,255,0.4);
    font-family: 'Consolas', monospace;
    font-size: 10px;
    text-align: center;
    line-height: 1.8;
    pointer-events: none;
  }
  #loading.hidden { display: none; }
  #error-panel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,100,100,0.7);
    font-family: 'Consolas', monospace;
    font-size: 10px;
    text-align: center;
    line-height: 1.8;
    display: none;
  }
</style>

<!-- ES Module import map: 本地文件优先，CDN 兜底 -->
<script type="importmap">
{
  "imports": {
    "three": "./three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "./three-vrm.module.js",
    "@pixiv/three-vrm-core": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-core@2.1.0/lib/three-vrm-core.module.js",
    "@pixiv/three-vrm-materials-mtoon": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-materials-mtoon@2.1.0/lib/three-vrm-materials-mtoon.module.js"
  }
}
</script>
</head>
<body>
<div id="vrm-container">
  <canvas id="vrm-canvas"></canvas>
  <div class="scanlines"></div>
  <div id="loading">
    VRM INIT<br>
    <span id="load-status">初始化渲染引擎</span>
  </div>
  <div id="error-panel">
    <span id="error-text"></span>
  </div>
  <div class="status-bar">
    <div class="status-dot"></div>
    <div class="status-label" id="emotion-label">IDLE</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

let scene, camera, renderer, clock;
let vrm = null;
let targetEmotion = { name: "neutral", intensity: 1.0 };
let speaking = false;
let blinkTimer = 0;
let nextBlinkTime = 3 + Math.random() * 3;

const loadStatus = document.getElementById("load-status");
const loadingEl = document.getElementById("loading");
const errorPanel = document.getElementById("error-panel");
const errorText = document.getElementById("error-text");
const emotionLabel = document.getElementById("emotion-label");

function showError(msg) {
  loadingEl.classList.add("hidden");
  errorPanel.style.display = "block";
  errorText.innerHTML = msg;
}

// ── 1. 场景初始化 ──
function initScene() {
  const canvas = document.getElementById("vrm-canvas");
  const container = document.getElementById("vrm-container");
  const w = container.clientWidth || 220;
  const h = container.clientHeight || 220;

  scene = new THREE.Scene();
  clock = new THREE.Clock();

  renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true,
  });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // ★ 加大 FOV + 拉远相机 → 显示全身
  camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 20);
  camera.position.set(0, 0.95, 1.6);
  camera.lookAt(0, 0.95, 0);

  const ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(1, 2, 1);
  scene.add(dir);
  const rim = new THREE.DirectionalLight(0x00D4FF, 0.3);
  rim.position.set(-1, 0.5, -1);
  scene.add(rim);
  const bottom = new THREE.PointLight(0x00D4FF, 0.3, 5);
  bottom.position.set(0, 0.3, 0.5);
  scene.add(bottom);

  window.addEventListener("resize", onResize);
}

function onResize() {
  const container = document.getElementById("vrm-container");
  const w = container.clientWidth || 220;
  const h = container.clientHeight || 220;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

// ── 2. VRM 加载 ──
let availableExpressions = []; // 记录模型实际支持的表情

async function loadVRM() {
  loadStatus.textContent = "加载 VRM 模型";
  try {
    const response = await fetch("model.vrm");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const arrayBuffer = await response.arrayBuffer();

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    const gltf = await new Promise((resolve, reject) => {
      loader.parse(arrayBuffer, "", resolve, reject);
    });

    vrm = gltf.userData.vrm;
    window.vrm = vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.removeUnnecessaryJoints(gltf.scene);

    VRMUtils.rotateVRM0(vrm);

    vrm.scene.traverse((obj) => {
      if (obj.material) {
        obj.material.transparent = true;
        obj.material.opacity = 0.92;
      }
    });

    // ★ 收集模型实际支持的表情名
    availableExpressions = [];
    if (vrm.expressionManager && vrm.expressionManager.expressions) {
      availableExpressions = vrm.expressionManager.expressions.map(e => e.expressionName);
      console.log("[VRM] 支持的表情:", availableExpressions.join(", "));
    }

    scene.add(vrm.scene);
    loadingEl.classList.add("hidden");
    console.log("[VRM] 模型加载成功");
  } catch (e) {
    console.warn("[VRM] 模型加载失败:", e.message);
    loadStatus.innerHTML = "模型加载失败: " + e.message + "<br>5秒后重试...";
    setTimeout(loadVRM, 5000);
  }
}

// ── 3. 表情控制 API ──
function findExpression(name) {
  if (!vrm || !vrm.expressionManager) return null;
  // 大小写不敏感匹配
  return availableExpressions.find(
    e => e.toLowerCase() === name.toLowerCase()
  ) || null;
}

window.setEmotion = function(name, intensity) {
  if (!name) name = "neutral";
  targetEmotion = { name: name, intensity: Math.max(0, Math.min(1, intensity)) };
  emotionLabel.textContent = name.toUpperCase();
};

window.setSpeaking = function(isSpeaking) {
  speaking = !!isSpeaking;
  // 说话时自动张嘴（如果模型支持 mouthOpen/aa/oh 等表情）
  emotionLabel.textContent = speaking ? "SPEAKING" : (targetEmotion.name || "IDLE").toUpperCase();
};

// ★ 表情插值：把当前表情平滑过渡到目标表情
let _expressionValues = {}; // 记录每个表情的当前权重

function updateExpressions() {
  if (!vrm || !vrm.expressionManager) return;

  const lerpSpeed = 0.08;

  // 目标表情名
  const target = targetEmotion.name || "neutral";
  const targetIntensity = targetEmotion.intensity;

  // 把所有表情平滑归零，目标表情逼近目标强度
  for (const exprName of availableExpressions) {
    const isTarget = exprName.toLowerCase() === target.toLowerCase();
    const targetVal = isTarget ? targetIntensity : 0;
    const current = _expressionValues[exprName] || 0;
    const newVal = current + (targetVal - current) * lerpSpeed;
    _expressionValues[exprName] = newVal;
    vrm.expressionManager.setValue(exprName, Math.round(newVal * 1000) / 1000);
  }
}

// ★ 眨眼（独立于表情系统）
let _isBlinking = false;

function updateBlink(dt) {
  if (!vrm || !vrm.expressionManager) return;
  // 检查模型是否支持 blink
  const blinkExpr = findExpression("blink");
  if (!blinkExpr) return;

  blinkTimer += dt;
  if (blinkTimer >= nextBlinkTime && !_isBlinking) {
    _isBlinking = true;
    vrm.expressionManager.setValue(blinkExpr, 1.0);
    setTimeout(() => {
      if (vrm && vrm.expressionManager) {
        vrm.expressionManager.setValue(blinkExpr, 0);
        _isBlinking = false;
      }
    }, 150);
    blinkTimer = 0;
    nextBlinkTime = 2.5 + Math.random() * 4;
  }
}

// ★ 呼吸 + 身体摇摆 + 微动
function updateBodyAnim(t) {
  if (!vrm || !vrm.humanoid) return;

  // 呼吸（脊柱起伏）
  const spine = vrm.humanoid.getNormalizedBoneNode("spine");
  if (spine) {
    spine.position.y = Math.sin(t * 1.2) * 0.006;
  }

  // 头部微动
  const head = vrm.humanoid.getNormalizedBoneNode("head");
  if (head) {
    head.rotation.y = Math.sin(t * 0.25) * 0.03;
    if (speaking) {
      head.rotation.x = Math.sin(t * 4.5) * 0.02;
    } else {
      head.rotation.x *= 0.95;
    }
  }

  // 上半身微微左右摆动（自然的重心移动）
  const hips = vrm.humanoid.getNormalizedBoneNode("hips");
  if (hips) {
    hips.rotation.z = Math.sin(t * 0.4) * 0.008;
  }

  // 手臂自然晃动（如果模型有手臂骨骼）
  const leftArm = vrm.humanoid.getNormalizedBoneNode("leftUpperArm");
  const rightArm = vrm.humanoid.getNormalizedBoneNode("rightUpperArm");
  if (leftArm) {
    leftArm.rotation.z = Math.sin(t * 0.3) * 0.01 - 0.02;
  }
  if (rightArm) {
    rightArm.rotation.z = Math.sin(t * 0.3 + Math.PI) * 0.01 + 0.02;
  }
}

// ── 4. 动画循环 ──
function animate() {
  requestAnimationFrame(animate);
  if (!renderer) return;
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  if (!vrm) {
    renderer.render(scene, camera);
    return;
  }

  // 表情平滑过渡
  updateExpressions();

  // 眨眼
  updateBlink(dt);

  // 身体动画（呼吸 + 摇摆 + 手势）
  updateBodyAnim(t);

  // 说话时张嘴（遍历模型支持的 aa/oh/mouthOpen 等表情）
  if (speaking && vrm.expressionManager) {
    const mouthExpr = findExpression("aa") || findExpression("oh") || findExpression("mouthOpen") || findExpression("ao");
    if (mouthExpr) {
      const mouthVal = Math.max(0, Math.sin(t * 8) * 0.5 + 0.3);
      vrm.expressionManager.setValue(mouthExpr, mouthVal);
    }
  }

  if (vrm.update) vrm.update(dt);
  renderer.render(scene, camera);
}

// ── 5. 启动 ──
if (location.protocol === "file:") {
  showError(
    "file:// 协议无法加载模型<br><br>" +
    "请运行测试服务:<br>" +
    "python vrm_module/test_server.py<br><br>" +
    "或直接启动主程序测试"
  );
} else {
  initScene();
  animate();
  loadVRM();
}
</script>
</body>
</html>
