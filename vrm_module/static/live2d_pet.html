<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live2D Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;position:absolute;top:0;left:0}
#bubble{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  padding:4px 12px;border-radius:12px;
  font:12px/1.4 "Microsoft YaHei",sans-serif;color:#e6edf3;
  background:rgba(22,27,34,0.9);
  border:1px solid #30363d;
  white-space:nowrap;
  opacity:0;transition:opacity 0.3s;
  pointer-events:none;z-index:999;
}
#bubble.show{opacity:1}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="bubble"></div>

<!--
  正确的库加载顺序：
  1. PixiJS 渲染引擎
  2. Cubism 2 Core（支持 .model.json 模型）
  3. Cubism 4 Core（支持 .model3.json 模型）
  4. pixi-live2d-display index（同时支持 Cubism 2+4）
-->
<script src="lib/pixi.min.js"></script>
<script src="lib/live2d.min.js"></script>
<script src="lib/live2dcubismcore.min.js"></script>
<script src="lib/index.min.js"></script>

<script>
(function () {
  "use strict";

  // ★ 暴露 PIXI 到 window，pixi-live2d-display 需要引用
  window.PIXI = PIXI;

  var canvas = document.getElementById("canvas");
  var app = null;
  var model = null;
  var currentEmotion = "neutral";
  var speaking = false;
  var modelIndex = 0;
  var tapCount = 0;
  var lastTapTime = 0;

  // ── 模型列表 ──
  // Haru/Hiyori = Cubism 4 (.model3.json)，Shizuku = Cubism 2 (.model.json)
  var MODELS = [
    {
      name: "Haru",
      url: "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/haru/haru_greeter_t03.model3.json",
    },
    {
      name: "Shizuku",
      url: "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/shizuku/shizuku.model.json",
    },
    {
      name: "Hiyori",
      url: "https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/hiyori/hiyori.model3.json",
    },
  ];

  // ── 互动台词 ──
  var LINES = {
    head: [
      "嗯？怎么了~", "不要摸头啦！", "嘻嘻~", "你好呀！",
      "在叫我吗？", "嗯嗯，我在听~", "头发放不整齐啦...",
    ],
    body: [
      "呀！别碰！", "好痒~", "哼，讨厌！", "嘻嘻~",
      "你在干什么！", "不要闹~", "好啦好啦~",
    ],
    idle: [
      "好无聊呀...", "嗯？", "有人在看我吗？", "今天天气真好~",
      "想聊天吗？", "我在这里哦~",
    ],
    greet: [
      "你好！我是 AI 助手~", "欢迎回来！", "今天也要加油哦！",
    ],
  };

  function pickLine(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  var bubbleTimer = null;
  function showBubble(text, duration) {
    var el = document.getElementById("bubble");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      el.classList.remove("show");
    }, duration || 3000);
  }

  // ── 初始化 PixiJS ──
  function initApp() {
    try {
      app = new PIXI.Application({
        view: canvas,
        transparent: true,
        autoStart: true,
        resizeTo: window,
        backgroundAlpha: 0,
      });
    } catch (e) {
      console.error("[Live2D] PixiJS 初始化失败:", e);
      return;
    }

    var saved = localStorage.getItem("live2d_model_index");
    if (saved !== null) modelIndex = parseInt(saved) % MODELS.length;

    loadModel();
  }

  // ── 加载模型 ──
  function loadModel() {
    var cfg = MODELS[modelIndex];
    showBubble("加载: " + cfg.name + "...", 8000);
    console.log("[Live2D] 加载模型:", cfg.name, cfg.url);

    var Live2DModel = PIXI.live2d.Live2DModel;

    Live2DModel.from(cfg.url, { autoInteract: false }).then(function (m) {
      if (model) {
        app.stage.removeChild(model);
        model.destroy();
      }
      model = m;
      fitModel();
      app.stage.addChild(model);

      // 鼠标跟踪（眼睛跟随）
      canvas.addEventListener("mousemove", function (e) {
        if (model) model.focus(e.clientX, e.clientY);
      });

      // ★ 点击互动
      model.on("hit", function (areas) {
        var now = Date.now();
        if (now - lastTapTime < 500) {
          tapCount++;
        } else {
          tapCount = 1;
        }
        lastTapTime = now;

        if (areas.indexOf("head") >= 0) {
          try { model.motion("tap_head"); } catch (e) {}
          if (tapCount >= 3) {
            showBubble("好啦好啦！不要一直摸头！", 3000);
          } else {
            showBubble(pickLine(LINES.head), 3000);
          }
        } else if (areas.indexOf("body") >= 0) {
          try { model.motion("tap_body"); } catch (e) {}
          showBubble(pickLine(LINES.body), 3000);
        } else {
          showBubble(pickLine(LINES.idle), 3000);
        }
      });

      // 播放待机动作 + 打招呼
      try { model.motion("idle"); } catch (e) {}
      setTimeout(function () {
        showBubble(pickLine(LINES.greet), 4000);
      }, 1500);

      // 随机闲置台词
      setInterval(function () {
        if (!speaking && Math.random() < 0.3) {
          showBubble(pickLine(LINES.idle), 3000);
        }
      }, 30000);

      console.log("[Live2D] 模型加载成功:", cfg.name);
    }).catch(function (e) {
      console.error("[Live2D] 加载失败:", cfg.name, e);
      showBubble(cfg.name + " 加载失败，双击切换", 5000);
    });
  }

  // ── 适配模型 ──
  function fitModel() {
    if (!model) return;
    var w = canvas.clientWidth;
    var h = canvas.clientHeight;
    var s = Math.min(w / model.width, h / model.height) * 0.9;
    model.scale.set(s);
    model.x = (w - model.width * s) / 2;
    model.y = (h - model.height * s) / 2;
  }

  // ── 切换模型 ──
  window.switchModel = function () {
    modelIndex = (modelIndex + 1) % MODELS.length;
    localStorage.setItem("live2d_model_index", modelIndex);
    loadModel();
  };

  // ── 对外 API ──
  window.setEmotion = function (emotion, intensity) {
    currentEmotion = emotion;
    if (speaking || !model) return;
    try { model.expression(emotion); } catch (e) {}
    var motionMap = {
      happy: "tap_body", sad: "tap_body", angry: "tap_body",
      surprised: "tap_head", thinking: "idle", love: "tap_body",
    };
    var motion = motionMap[emotion];
    if (motion) { try { model.motion(motion); } catch (e) {} }

    var bubbleMap = {
      happy: "好开心!", sad: "有点难过...", angry: "哼！生气了！",
      surprised: "诶?!", thinking: "让我想想...", love: "好喜欢~",
      neutral: "",
    };
    var text = bubbleMap[emotion] || "";
    if (text) showBubble(text, 3000);
  };

  window.setSpeaking = function (isSpeaking) {
    speaking = isSpeaking;
    if (!model) return;
    if (isSpeaking) {
      try { model.motion("tap_body"); } catch (e) {}
      showBubble("...", 60000);
    } else {
      try { model.motion("idle"); } catch (e) {}
      var el = document.getElementById("bubble");
      el.classList.remove("show");
      window.setEmotion(currentEmotion);
    }
  };

  window.addEventListener("resize", function () { fitModel(); });

  // ── 启动 ──
  function tryInit() {
    if (typeof PIXI !== "undefined" && PIXI.live2d && PIXI.live2d.Live2DModel) {
      console.log("[Live2D] 库加载完成，开始初始化");
      initApp();
    } else {
      console.log("[Live2D] 等待库加载... PIXI=" + typeof PIXI + " live2d=" + !!(PIXI && PIXI.live2d));
      setTimeout(tryInit, 300);
    }
  }
  tryInit();
})();
</script>
</body>
</html>
