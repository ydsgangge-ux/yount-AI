<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live2D Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%}
#status{
  position:absolute;top:6px;right:6px;
  padding:2px 8px;border-radius:8px;
  font:10px/1.4 sans-serif;color:#c9d1d9;
  background:rgba(22,27,34,0.75);
  border:1px solid #30363d;
  opacity:0;transition:opacity 0.3s;
  pointer-events:none;
}
#status.show{opacity:1}
#model-switch{
  position:absolute;bottom:6px;right:6px;
  padding:2px 6px;border-radius:6px;
  font:9px/1.4 sans-serif;color:#8b949e;
  background:rgba(22,27,34,0.6);
  border:1px solid #30363d;
  cursor:pointer;
  z-index:10;
}
#model-switch:hover{color:#c9d1d9;background:rgba(22,27,34,0.9)}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status"></div>
<div id="model-switch" title="切换模型">切换</div>

<!-- 1. PixiJS v6 -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<!-- 2. Live2D Cubism 4 Core -->
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<!-- 3. pixi-live2d-display (Cubism 4 only) -->
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

<script>
(async function () {
  "use strict";

  // ── 1. 创建 PixiJS 应用 ──
  const canvas = document.getElementById("canvas");
  const app = new PIXI.Application({
    view: canvas,
    transparent: true,
    autoStart: true,
    resizeTo: window,
  });

  // 暴露 PIXI（pixi-live2d-display 需要）
  window.PIXI = PIXI;

  let model = null;
  let currentEmotion = "neutral";
  let speaking = false;
  let modelIndex = 0;

  // ── 2. 模型列表（已验证可用的 CDN） ──
  const MODELS = [
    {
      name: "仙狐小姐",
      url: "https://cdn.jsdelivr.net/gh/Eikanya/Live2d-model@v1.0.0/Live2D/Senko_Normals/senko.model3.json",
      motionMap: { idle: "Idle", tap: "Tap", tapHead: "Taphead" },
    },
    {
      name: "拉菲",
      url: "https://cdn.jsdelivr.net/gh/zenghongtu/live2d-model-assets@master/assets/moc3/lafei/lafei.model3.json",
      motionMap: { idle: "", tap: "", tapHead: "" },
    },
    {
      name: "Z46",
      url: "https://cdn.jsdelivr.net/gh/zenghongtu/live2d-model-assets@master/assets/moc3/z46/z46.model3.json",
      motionMap: { idle: "", tap: "", tapHead: "" },
    },
    {
      name: "独角兽",
      url: "https://cdn.jsdelivr.net/gh/zenghongtu/live2d-model-assets@master/assets/moc3/unicorn/unicorn.model3.json",
      motionMap: { idle: "", tap: "", tapHead: "" },
    },
  ];

  // 本地模型优先
  const LOCAL_MODEL_JSON = "live2d/model3.json";

  // ── 3. 加载模型 ──
  async function loadModel(url) {
    try {
      if (model) {
        app.stage.removeChild(model);
        model.destroy();
      }

      console.log("[Live2D] 加载模型:", url);
      model = await PIXI.live2d.Live2DModel.from(url, { autoInteract: false });

      fitModel();
      app.stage.addChild(model);

      // 点击交互
      model.on("hit", (hitAreas) => {
        console.log("[Live2D] 点击:", hitAreas);
        if (hitAreas.includes("head")) {
          playMotion("tapHead");
        } else {
          playMotion("tap");
        }
      });

      // 播放待机
      playMotion("idle");
      showStatus("已加载");
      console.log("[Live2D] 模型加载成功");
    } catch (e) {
      console.error("[Live2D] 加载失败:", e);
      showStatus("加载失败，切换下一个...");
      // 自动尝试下一个模型
      modelIndex = (modelIndex + 1) % MODELS.length;
      setTimeout(() => loadModel(MODELS[modelIndex].url), 1500);
    }
  }

  // 适配画布
  function fitModel() {
    if (!model) return;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    const scale = Math.min(w / model.width * 0.85, h / model.height * 0.85);
    model.scale.set(scale);
    model.x = (w - model.width * scale) / 2;
    model.y = (h - model.height * scale) / 2;
  }

  window.addEventListener("resize", () => { if (model) fitModel(); });

  // ── 4. 动作控制 ──
  function playMotion(groupKey, index) {
    if (!model) return;
    const cfg = MODELS[modelIndex];
    const group = cfg && cfg.motionMap ? cfg.motionMap[groupKey] : groupKey;
    if (!group && group !== "") return;
    try {
      if (index !== undefined) {
        model.motion(group, index);
      } else {
        model.motion(group);
      }
    } catch (e) { /* 模型可能没有该动作组 */ }
  }

  function setExpression(name) {
    if (!model) return;
    try { model.expression(name); } catch (e) {}
  }

  // ── 5. 对外 API（兼容 VRM 接口） ──
  window.setEmotion = function (emotion, intensity) {
    currentEmotion = emotion;
    if (speaking) return;

    const motionMap = {
      happy: "tap", sad: "tap", angry: "tap",
      surprised: "tapHead", thinking: "idle", love: "tap",
    };
    const motion = motionMap[emotion];
    if (motion) playMotion(motion);
    showStatus(emotion);
  };

  window.setSpeaking = function (isSpeaking) {
    speaking = isSpeaking;
    if (isSpeaking) {
      playMotion("tap");
      showStatus("说话中");
    } else {
      playMotion("idle");
      window.setEmotion(currentEmotion);
    }
  };

  // ── 6. 鼠标跟踪 ──
  canvas.addEventListener("mousemove", (e) => {
    if (!model) return;
    model.focus(e.clientX, e.clientY);
  });

  // ── 7. 切换模型 ──
  document.getElementById("model-switch").addEventListener("click", () => {
    modelIndex = (modelIndex + 1) % MODELS.length;
    showStatus("切换: " + MODELS[modelIndex].name);
    loadModel(MODELS[modelIndex].url);
  });

  // ── 8. 状态提示 ──
  let statusTimer = null;
  function showStatus(text) {
    const el = document.getElementById("status");
    const labels = {
      neutral: "待机", happy: "开心", sad: "难过",
      angry: "生气", surprised: "惊讶", thinking: "思考",
      love: "喜欢", "说话中": "说话中",
    };
    el.textContent = labels[text] || text;
    el.classList.add("show");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => el.classList.remove("show"), 2000);
  }

  // ── 9. 启动 ──
  async function init() {
    // 尝试本地模型
    try {
      const r = await fetch(LOCAL_MODEL_JSON, { method: "HEAD" });
      if (r.ok) {
        console.log("[Live2D] 发现本地模型");
        await loadModel(LOCAL_MODEL_JSON);
        return;
      }
    } catch (e) {}

    // 从 localStorage 恢复上次选择的模型
    const saved = localStorage.getItem("live2d_model_index");
    if (saved !== null) modelIndex = parseInt(saved) % MODELS.length;

    // 加载 CDN 模型
    showStatus("加载: " + MODELS[modelIndex].name);
    await loadModel(MODELS[modelIndex].url);
  }

  // 保存模型选择
  const origLoad = loadModel;
  loadModel = async function(url) {
    await origLoad(url);
    localStorage.setItem("live2d_model_index", modelIndex);
  };

  init();
})();
</script>
</body>
</html>
