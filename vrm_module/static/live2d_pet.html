<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live2D Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
/* 调整看板娘位置和大小 */
#waifu{
  position:relative!important;
  width:100%!important;
  height:100%!important;
  bottom:auto!important;
  left:auto!important;
}
#waifu-tool{
  display:none!important;
}
#waifu-tips{
  border:none!important;box-shadow:none!important;
  background:rgba(22,27,34,0.85)!important;
  color:#c9d1d9!important;font-size:12px!important;
  border-radius:8px!important;
}
</style>
</head>
<body>

<!-- live2d-widgets: 一行代码加载 Live2D 看板娘 -->
<script src="https://fastly.jsdelivr.net/npm/live2d-widgets@1.0.0/dist/autoload.js"></script>

<script>
(function () {
  "use strict";

  var currentEmotion = "neutral";
  var speaking = false;

  // ── 对外 API（兼容 VRM 接口） ──
  window.setEmotion = function (emotion, intensity) {
    currentEmotion = emotion;
    if (speaking) return;
    // live2d-widgets 内置了提示语系统
    var labels = {
      neutral: "待机中~", happy: "好开心!", sad: "有点难过...",
      angry: "哼! 生气了!", surprised: "诶?!", thinking: "让我想想...",
      love: "好喜欢~",
    };
    // 尝试调用内置的 showMessage
    if (labels[emotion] && typeof showMessage === "function") {
      try { showMessage(labels[emotion], 3000, 0); } catch (e) {}
    }
  };

  window.setSpeaking = function (isSpeaking) {
    speaking = isSpeaking;
    if (isSpeaking) {
      if (typeof showMessage === "function") {
        try { showMessage("...", 60000, 0); } catch (e) {}
      }
    } else {
      if (typeof showMessage === "function") {
        try { showMessage("", 0, 0); } catch (e) {}
      }
      window.setEmotion(currentEmotion);
    }
  };

  // 切换模型（live2d-widgets 内置了切换功能）
  window.switchModel = function () {
    var btn = document.querySelector("#waifu-tool .fa-random");
    if (btn) btn.click();
  };
})();
</script>
</body>
</html>
