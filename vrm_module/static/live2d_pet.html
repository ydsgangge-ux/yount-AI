<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live2D Pet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
/* 隐藏 oh-my-live2d 的工具栏和提示框装饰 */
#oml2d-toolbar{display:none!important}
#oml2d-tips{border:none!important;box-shadow:none!important;background:rgba(22,27,34,0.8)!important;color:#c9d1d9!important;font-size:12px!important;border-radius:8px!important}
</style>
</head>
<body>

<!-- oh-my-live2d: 内含 PixiJS + Cubism Core，一个脚本搞定 -->
<script src="https://cdn.jsdelivr.net/npm/oh-my-live2d@latest/dist/index.min.js"></script>

<script>
(function () {
  "use strict";

  let oml2d = null;
  let currentEmotion = "neutral";
  let speaking = false;
  let modelIndex = 0;

  // ── 模型列表 ──
  const MODELS = [
    {
      name: "仙狐小姐",
      path: "https://cdn.jsdelivr.net/gh/Eikanya/Live2d-model/Live2D/Senko_Normals/senko.model3.json",
      scale: 0.12,
      position: [0, 50],
    },
    {
      name: "森巫女",
      path: "https://cdn.jsdelivr.net/gh/Eikanya/Live2d-model/galgame%20live2d/Fox%20Hime%20Zero/mori_miko/mori_miko.model3.json",
      scale: 0.12,
      position: [0, 50],
    },
    {
      name: "拉菲",
      path: "https://cdn.jsdelivr.net/gh/zenghongtu/live2d-model-assets@master/assets/moc3/lafei/lafei.model3.json",
      scale: 0.12,
      position: [0, 50],
    },
    {
      name: "Z46",
      path: "https://cdn.jsdelivr.net/gh/zenghongtu/live2d-model-assets@master/assets/moc3/z46/z46.model3.json",
      scale: 0.12,
      position: [0, 50],
    },
    {
      name: "独角兽",
      path: "https://cdn.jsdelivr.net/gh/zenghongtu/live2d-model-assets@master/assets/moc3/unicorn/unicorn.model3.json",
      scale: 0.12,
      position: [0, 50],
    },
  ];

  // ── 初始化 ──
  function init() {
    var saved = localStorage.getItem("live2d_model_index");
    if (saved !== null) modelIndex = parseInt(saved) % MODELS.length;
    var cfg = MODELS[modelIndex];

    try {
      oml2d = OML2D.loadOml2d({
        dockedPosition: "left",
        sayHello: false,
        tips: {
          idleTips: {
            wordTheDay: false,
          },
        },
        models: [
          {
            path: cfg.path,
            scale: cfg.scale,
            position: cfg.position,
            stageStyle: {
              width: 220,
              height: 340,
            },
          },
        ],
      });
      console.log("[Live2D] 初始化, 模型:", cfg.name);
    } catch (e) {
      console.error("[Live2D] 初始化失败:", e);
    }
  }

  // ── 对外 API（兼容 VRM 接口） ──
  window.setEmotion = function (emotion, intensity) {
    currentEmotion = emotion;
    if (speaking) return;

    var labels = {
      neutral: "待机中~", happy: "好开心!", sad: "有点难过...",
      angry: "哼! 生气了!", surprised: "诶?!", thinking: "让我想想...",
      love: "好喜欢~",
    };
    if (labels[emotion] && oml2d) {
      try { oml2d.tipsMessage(labels[emotion], 3000, 0); } catch (e) {}
    }
  };

  window.setSpeaking = function (isSpeaking) {
    speaking = isSpeaking;
    if (isSpeaking) {
      if (oml2d) {
        try { oml2d.tipsMessage("...", 60000, 0); } catch (e) {}
      }
    } else {
      if (oml2d) {
        try { oml2d.tipsMessage("", 0, 0); } catch (e) {}
      }
      window.setEmotion(currentEmotion);
    }
  };

  // 切换模型（供外部调用）
  window.switchModel = function () {
    modelIndex = (modelIndex + 1) % MODELS.length;
    localStorage.setItem("live2d_model_index", modelIndex);
    if (oml2d) {
      try { oml2d.unloadOml2d(); } catch (e) {}
    }
    init();
  };

  // 等待 OML2D 加载
  if (typeof OML2D !== "undefined") {
    init();
  } else {
    var t = setInterval(function () {
      if (typeof OML2D !== "undefined") {
        clearInterval(t);
        init();
      }
    }, 200);
    setTimeout(function () { clearInterval(t); }, 15000);
  }
})();
</script>
</body>
</html>
